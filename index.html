<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Our Class Tree</title>

<style>

/* =========================================================
   BASIC
========================================================= */

:root {
    --green-dark: #25443a;
    --green: #4e9d6e;
    --cream: #fff9ed;
    --white: rgba(255,255,255,.94);
    --shadow: 0 10px 30px rgba(65,53,33,.15);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #f7ecd4;

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans Thai",
        sans-serif;

    color: var(--green-dark);
}

/* =========================================================
   APP
========================================================= */

#app {

    position: fixed;

    inset: 0;

    overflow: hidden;

    touch-action: none;
}

/* Canvas */

#treeCanvas {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    touch-action: none;
}

/* =========================================================
   UI
========================================================= */

.hud {

    position: absolute;

    inset: 0;

    z-index: 10;

    pointer-events: none;
}

/* ---------------------------------------------------------
   TITLE
--------------------------------------------------------- */

.top {

    position: absolute;

    top: max(14px, env(safe-area-inset-top));

    left: 50%;

    transform: translateX(-50%);

    width: min(94vw, 760px);

    text-align: center;
}

.title {

    margin: 0;

    font-size: clamp(28px, 4vw, 48px);

    font-weight: 800;

    letter-spacing: .5px;

    text-shadow: 0 2px 0 rgba(255,255,255,.5);
}

.prompt {

    display: inline-block;

    margin-top: 6px;

    padding: 9px 17px;

    border-radius: 999px;

    background: rgba(255,255,255,.86);

    box-shadow: var(--shadow);

    font-size: clamp(14px, 2vw, 20px);

    font-weight: 600;
}

.hint {

    margin-top: 7px;

    font-size: 12px;

    opacity: .65;
}

/* ---------------------------------------------------------
   TEACHER BUTTON
--------------------------------------------------------- */

.teacher-button {

    pointer-events: auto;

    position: absolute;

    right: max(12px, env(safe-area-inset-right));

    top: max(12px, env(safe-area-inset-top));

    width: 44px;

    height: 44px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,.78);

    box-shadow: var(--shadow);

    font-size: 19px;

    opacity: .55;
}

.teacher-button:active {

    transform: scale(.94);
}

/* ---------------------------------------------------------
   COUNTER
--------------------------------------------------------- */

.counter {

    position: absolute;

    left: max(12px, env(safe-area-inset-left));

    bottom: max(12px, env(safe-area-inset-bottom));

    padding: 8px 14px;

    border-radius: 999px;

    background: rgba(255,255,255,.84);

    box-shadow: var(--shadow);

    font-size: 14px;
}

/* ---------------------------------------------------------
   TOUCH INDICATOR
--------------------------------------------------------- */

.touch-indicator {

    position: absolute;

    width: 56px;

    height: 56px;

    border-radius: 50%;

    border: 3px solid white;

    box-shadow:
        0 0 0 7px rgba(255,255,255,.2);

    transform: translate(-50%, -50%);

    display: none;

    animation: touchPulse .8s infinite;
}

@keyframes touchPulse {

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.12);

        opacity: .55;
    }
}

/* =========================================================
   NAME MODAL
========================================================= */

.modal {

    position: absolute;

    inset: 0;

    z-index: 30;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background: rgba(38,53,43,.28);

    backdrop-filter: blur(5px);

    pointer-events: auto;
}

.modal.show {

    display: flex;
}

.modal-card {

    width: min(92vw, 430px);

    background: var(--white);

    border-radius: 28px;

    padding: 28px;

    box-shadow:
        0 24px 70px rgba(33,35,25,.25);

    text-align: center;
}

.modal-icon {

    font-size: 48px;
}

.modal-title {

    margin: 6px 0 7px;

    font-size: 27px;
}

.modal-text {

    margin: 0 0 18px;

    opacity: .7;
}

/* ---------------------------------------------------------
   INPUT
--------------------------------------------------------- */

.name-input {

    width: 100%;

    border: 2px solid #e6dcc8;

    background: #fffdf7;

    border-radius: 17px;

    padding: 14px 16px;

    outline: none;

    text-align: center;

    font-size: 20px;

    color: var(--green-dark);
}

.name-input:focus {

    border-color: #86b99b;
}

/* ---------------------------------------------------------
   ACTIONS
--------------------------------------------------------- */

.modal-actions {

    display: flex;

    gap: 10px;

    margin-top: 14px;
}

.modal-actions button {

    flex: 1;

    border: none;

    border-radius: 16px;

    padding: 13px;

    font-weight: 750;

    font-size: 16px;
}

.cancel-button {

    background: #eee8dc;

    color: #5d625b;
}

.add-button {

    background: var(--green);

    color: white;
}

/* =========================================================
   TEACHER PANEL
========================================================= */

.teacher-panel {

    display: none;

    position: absolute;

    z-index: 40;

    right: 12px;

    top: 64px;

    width: min(92vw, 340px);

    background: white;

    border-radius: 22px;

    padding: 18px;

    box-shadow: var(--shadow);

    pointer-events: auto;
}

.teacher-panel.show {

    display: block;
}

.teacher-panel h3 {

    margin: 0 0 10px;
}

.teacher-panel button {

    width: 100%;

    border: none;

    border-radius: 13px;

    padding: 12px;

    margin-top: 8px;

    background: #f1eadc;

    font-size: 15px;
}

.teacher-panel .danger {

    background: #f7d8d2;

    color: #7a2f28;
}

.teacher-panel small {

    display: block;

    margin-top: 10px;

    opacity: .6;

    line-height: 1.4;
}

/* =========================================================
   TOAST
========================================================= */

.toast {

    position: absolute;

    z-index: 50;

    left: 50%;

    bottom: 70px;

    transform:
        translate(-50%, 10px);

    background: #284d3c;

    color: white;

    padding: 10px 17px;

    border-radius: 999px;

    opacity: 0;

    transition: .25s;

    pointer-events: none;

    white-space: nowrap;
}

.toast.show {

    opacity: 1;

    transform:
        translate(-50%, 0);
}
/* =========================================================
   HOLD PROGRESS
========================================================= */

#holdProgress {

    position: absolute;

    left: 50%;

    top: 55%;

    transform: translate(-50%, -50%);

    width: 110px;

    height: 110px;

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 20;

    pointer-events: none;
}


#progressCircle {

    width: 100px;

    height: 100px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        conic-gradient(
            #4e9d6e 0deg,
            #4e9d6e 0deg,
            rgba(255,255,255,.35) 0deg
        );

    box-shadow:
        0 4px 20px rgba(0,0,0,.2);

    position: relative;
}


#progressCircle::before {

    content: "";

    position: absolute;

    width: 76px;

    height: 76px;

    border-radius: 50%;

    background: rgba(255,255,255,.92);
}


#progressText {

    position: relative;

    z-index: 2;

    font-size: 22px;

    font-weight: 800;

    color: #25443a;
}
      
</style>
</head>


<body>

<div id="app">

    <!-- =====================================================
         CANVAS
    ====================================================== -->

    <canvas id="treeCanvas"></canvas>


    <!-- =====================================================
         UI
    ====================================================== -->

    <div class="hud">

        <div class="top">

            <h1 class="title">
                🌳 Our Class Tree
            </h1>

            <div class="prompt">
                วางมือบนหน้าจอ แล้วพิมพ์ชื่อของเรา!
            </div>

            <div class="hint">
                แตะเพื่อเพิ่มมือ • ลากเพื่อย้าย •

            </div>

            ⚙️

        <div

        </div>

    <div

            </div>

    <!-- =====================================================

    ====================================================== -->

    <div

            ของเครื่องนี้

    </div>


    <!-- =====================================================
         TOAST
    ====================================================== -->

    <div
        class="toast"
        id="toast">
    </div>

</div>

<!-- Firebase -->
<script type="module">

        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    const firebaseConfig = {

        apiKey: "AIzaSyCoqXj41sxtaRszOH9TbenwFlVjUHgwiAA",

        authDomain:
            "our-class-tree-ef0e9.firebaseapp.com",

        databaseURL:
            "https://our-class-tree-ef0e9-default-rtdb.firebaseio.com",

        projectId:
            "our-class-tree-ef0e9",

        storageBucket:
            "our-class-tree-ef0e9.firebasestorage.app",

        messagingSenderId:
            "401725741242",

        appId:
            "1:401725741242:web:8b416b2492b1328c4e0a83"

    };


    const firebaseApp =

    const database =

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById("treeCanvas");

const ctx =
    canvas.getContext("2d");

const modal =
    document.getElementById("nameModal");

const nameForm =
    document.getElementById("nameForm");

const nameInput =
    document.getElementById("nameInput");

const touchIndicator =
    document.getElementById("touchIndicator");

const counter =
    document.getElementById("counter");

const teacherButton =
    document.getElementById("teacherButton");

const teacherPanel =
    document.getElementById("teacherPanel");

const toast =
    document.getElementById("toast");

const holdProgress =
    document.getElementById("holdProgress");

const progressCircle =
    document.getElementById("progressCircle");

const progressText =
    document.getElementById("progressText");

/* =========================================================
   DATA
========================================================= */

const COLORS = [

    "#8BCB88",
    "#FF9B5C",
    "#FFD45C",
    "#70B7E8",
    "#D99BEA",
    "#F28BA8",
    "#79D5C5",
    "#FFB86B"

];


let leaves = [];

const treeRef =
    window.firebaseAPI.ref(
        window.firebaseAPI.database,
        "ourClassTree"
    );


/* รับข้อมูลจาก Firebase แบบเรียลไทม์ */

window.firebaseAPI.onValue(
    treeRef,
    snapshot => {
        const data =
            snapshot.val();

        if (data) {

            leaves =
                Object.values(data);

        } else {

            leaves = [];

        }

        updateCounter();

        draw();

    }
);

let selectedLeaf = null;

let pendingPosition = null;

let pointers = new Map();

let gesture = null;

let holdTimer = null;

let holdStart = null;

let holdProgressAnimation = null;

let animatedLeaves = [];

let animationTime = 0;

let W = 0;

let H = 0;

let DPR = 1;

const handGuideImage = new Image();

handGuideImage.src = "./handguide2.png";

handGuideImage.onload = () => {
    console.log("โหลด handguide2.png สำเร็จ");
    draw();
};

handGuideImage.onerror = () => {
    console.error("ไม่สามารถโหลด handguide2.png ได้");
};

/* =========================================================
   IMAGES
========================================================= */

const treeImage = new Image();
treeImage.src = "tree.png";

const handImage = new Image();
handImage.src = "hand.png";

const leafImage = new Image();
leafImage.src = "leaf.png";

treeImage.onload = () => {
    draw();
};

handImage.onload = () => {
    draw();
};

leafImage.onload = () => {
    createAnimatedLeaves();
    draw();
};      

/* =========================================================
   LOCAL STORAGE
========================================================= */

function saveTree() {

    const data = {};


    leaves.forEach(
        leaf => {

            data[leaf.id] =
                leaf;

        }
    );


    window.firebaseAPI.set(
    treeRef,
    data
);


    updateCounter();

}


function updateCounter() {

    counter.textContent =
        `ใบไม้ของเรา ${leaves.length} ใบ`;
}


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas() {

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W = window.innerWidth;

    H = window.innerHeight;

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

    draw();
}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   BACKGROUND
========================================================= */

/* =========================================================
   BACKGROUND IMAGE
========================================================= */

function drawBackground() {

    /* พื้นหลังสำรอง */

    ctx.fillStyle = "#f7ecd4";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* ถ้ายังโหลดรูปไม่เสร็จ ให้ใช้พื้นหลังสำรอง */

    if (!treeImage.complete) {
        return;
    }


    /* ทำให้รูปเต็มหน้าจอแบบ cover */

    const imageRatio =
        treeImage.width /
        treeImage.height;

    const screenRatio =
        W / H;


    let drawWidth;
    let drawHeight;
    let offsetX;
    let offsetY;


    if (imageRatio > screenRatio) {

        drawHeight = H;

        drawWidth =
            H * imageRatio;

        offsetX =
            (W - drawWidth) / 2;

        offsetY = 0;

    } else {

        drawWidth = W;

        drawHeight =
            W / imageRatio;

        offsetX = 0;

        offsetY =
            (H - drawHeight) / 2;

    }


    ctx.drawImage(
        treeImage,
        offsetX,
        offsetY,
        drawWidth,
        drawHeight
    );

}
      
/* =========================================================
   HAND SHAPE
========================================================= */

/* =========================================================
   DRAW HAND IMAGE
========================================================= */

function drawHandImage(
    leaf,
    selected = false
) {

    if (
        !handImage.complete ||
        !handImage.naturalWidth
    ) {
        return;
    }


    ctx.save();


    /* ขนาดรอยมือ */

    const baseSize = 170;

    const width =
        baseSize * leaf.scale;

    const height =
        baseSize *
        (
            handImage.height /
            handImage.width
        ) *
        leaf.scale;


    /* ตำแหน่ง */

    ctx.translate(
        leaf.x,
        leaf.y
    );


    ctx.rotate(
        leaf.rotation
    );


    /* -----------------------------------------------------
       SHADOW
    ----------------------------------------------------- */

    ctx.save();

    ctx.globalAlpha = .18;

    ctx.filter =
        "brightness(0)";

    ctx.drawImage(
        handImage,
        -width / 2 + 5,
        -height / 2 + 7,
        width,
        height
    );

    ctx.restore();


    /* -----------------------------------------------------
       COLORED HAND
    ----------------------------------------------------- */

    const coloredHand =
        createColoredHand(
            leaf.color
        );


    ctx.drawImage(
        coloredHand,
        -width / 2,
        -height / 2,
        width,
        height
    );


    /* -----------------------------------------------------
       NAME
    ----------------------------------------------------- */

    ctx.fillStyle =
        "#26483b";

    ctx.font =
        `700 ${Math.max(
            12,
            15 * leaf.scale
        )}px system-ui, "Noto Sans Thai", sans-serif`;

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillText(
        leaf.name,
        0,
        height * .30
    );


    /* -----------------------------------------------------
       SELECTED
    ----------------------------------------------------- */

    if (selected) {

        ctx.strokeStyle =
            "#ffffff";

        ctx.lineWidth = 3;

        ctx.setLineDash([
            7,
            5
        ]);


        ctx.beginPath();

        ctx.arc(
            0,
            0,
            Math.max(
                width,
                height
            ) * .55,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        ctx.setLineDash([]);

    }


    ctx.restore();

}

/* =========================================================
   COLOR HAND IMAGE
========================================================= */

const handColorCache = {};


function createColoredHand(color) {

    if (handColorCache[color]) {

        return handColorCache[color];

    }


    const offscreen =
        document.createElement(
            "canvas"
        );


    offscreen.width =
        handImage.naturalWidth;

    offscreen.height =
        handImage.naturalHeight;


    const offCtx =
        offscreen.getContext(
            "2d"
        );


    /* วาดสี */

    offCtx.fillStyle =
        color;

    offCtx.fillRect(
        0,
        0,
        offscreen.width,
        offscreen.height
    );


    /* ใช้รูปมือเป็น mask */

    offCtx.globalCompositeOperation =
        "destination-in";


    offCtx.drawImage(
        handImage,
        0,
        0
    );


    offCtx.globalCompositeOperation =
        "source-over";


    handColorCache[color] =
        offscreen;


    return offscreen;

}

/* =========================================================
   DRAW EVERYTHING
========================================================= */

function drawHandGuide() {

    if (
        !handGuideImage.complete ||
        !handGuideImage.naturalWidth
    ) {
        return;
    }

    const size =
        Math.min(W, H) * 0.99;

    const ratio =
        handGuideImage.height /
        handGuideImage.width;

    const width = size;
    const height = size * ratio;

    const x = W / 2;
    const y = H * 0.55;

    ctx.save();

    ctx.globalAlpha = 0.45;

    ctx.drawImage(
        handGuideImage,
        x - width / 2,
        y - height / 2,
        width,
        height
    );

    ctx.restore();
}

/* =========================================================
   ANIMATED LEAVES
========================================================= */

function createAnimatedLeaves() {

    animatedLeaves = [];

    const count = 75;

    for (let i = 0; i < count; i++) {

        /*
         * ตำแหน่งของใบไม้
         * ปรับบริเวณนี้ให้ตรงกับต้นไม้ของคุณได้
         */

        const x =
            W * (
                0.15 +
                Math.random() * 0.64
            );

        const y =
            H * (
                0.23 +
                Math.random() * 0.48
            );

        animatedLeaves.push({

            x: x,

            y: y,

            size:
                20 +
                Math.random() * 25,

            rotation:
                Math.random() *
                Math.PI * 2,

            speed:
                0.002 +
                Math.random() * 0.003,

            swing:
                0.10 +
                Math.random() * 0.15,

            phase:
                Math.random() *
                Math.PI * 2

        });

    }

}

function drawAnimatedLeaves() {

function animate() {

    animationTime += 0.05;

    draw();

    requestAnimationFrame(
        animate
    );

}
      
    if (
        !leafImage.complete ||
        !leafImage.naturalWidth
    ) {
        return;
    }

    ctx.save();

    for (
        const leaf of animatedLeaves
    ) {

        /*
         * การไหวของใบไม้
         */

        const sway =
            Math.sin(
                animationTime *
                leaf.speed +
                leaf.phase
            ) *
            leaf.swing;

        const swayY =
            Math.cos(
                animationTime *
                leaf.speed * 0.7 +
                leaf.phase
            ) *
            2;

        ctx.save();

        ctx.translate(
            leaf.x,
            leaf.y + swayY
        );

        ctx.rotate(
            leaf.rotation +
            sway
        );

        ctx.globalAlpha = 0.9;

        ctx.drawImage(
            leafImage,
            -leaf.size / 2,
            -leaf.size / 2,
            leaf.size,
            leaf.size
        );

        ctx.restore();

    }

    ctx.restore();

}
      
function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    /* ต้นไม้ */

    drawBackground();

    /* ใบไม้ที่ไหว */

    drawAnimatedLeaves();

    /* รอยมือสำหรับให้เด็กวาง */

    drawHandGuide();

    /* มือของเด็ก */

    for (
        const leaf
        of leaves
    ) {

        drawHandImage(
            leaf,
            leaf === selectedLeaf
        );

    }

}

/* =========================================================
   GET POINTER POSITION
========================================================= */

function getPointerPosition(
    event
) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            event.clientX -
            rect.left,

        y:
            event.clientY -
            rect.top

    };

}


/* =========================================================
   FIND HAND UNDER FINGER
========================================================= */

function findLeaf(
    x,
    y
) {

    for (
        let i = leaves.length - 1;
        i >= 0;
        i--
    ) {

        const leaf =
            leaves[i];

        const dx =
            x - leaf.x;

        const dy =
            y - leaf.y;


        const radius =
            95 * leaf.scale;


        if (
            dx * dx +
            dy * dy <
            radius * radius
        ) {

            return leaf;

        }

    }


    return null;

}

function startHoldProgress() {

    holdProgress.style.display =
        "flex";

    holdStart =
        performance.now();

    function updateProgress(now) {

        if (!holdStart) {
            return;
        }

        const elapsed =
            now - holdStart;

        const percent =
            Math.min(
                elapsed / 3000,
                1
            );

        const percentNumber =
            Math.floor(
                percent * 100
            );

        progressText.textContent =
            percentNumber + "%";

        progressCircle.style.background =
            `conic-gradient(
                #4e9d6e ${percent * 360}deg,
                rgba(255,255,255,.35) ${percent * 360}deg
            )`;

        if (percent < 1) {

            holdProgressAnimation =
                requestAnimationFrame(
                    updateProgress
                );

        }

    }

    holdProgressAnimation =
        requestAnimationFrame(
            updateProgress
        );
}


function stopHoldProgress() {

    holdStart = null;

    if (holdProgressAnimation) {

        cancelAnimationFrame(
            holdProgressAnimation
        );

        holdProgressAnimation =
            null;
    }

    holdProgress.style.display =
        "none";

    progressText.textContent =
        "0%";

    progressCircle.style.background =
        `conic-gradient(
            #4e9d6e 0deg,
            rgba(255,255,255,.35) 0deg
        )`;
}
      
/* =========================================================
   POINTER DOWN
========================================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();


        canvas.setPointerCapture(
            event.pointerId
        );


        const point =
            getPointerPosition(event);


        pointers.set(
            event.pointerId,
            point
        );


        /* visual touch feedback */

        touchIndicator.style.display =
            "block";

        touchIndicator.style.left =
            point.x + "px";

        touchIndicator.style.top =
            point.y + "px";


        const existingLeaf =
            findLeaf(
                point.x,
                point.y
            );


        if (existingLeaf) {

            selectedLeaf =
                existingLeaf;


            gesture = {

                type: "drag",

                leaf: existingLeaf,

                offsetX:
                    point.x -
                    existingLeaf.x,

                offsetY:
                    point.y -
                    existingLeaf.y

            };


            /* bring to front */

            const index =
                leaves.indexOf(
                    existingLeaf
                );


            if (index >= 0) {

                leaves.splice(
                    index,
                    1
                );

                leaves.push(
                    existingLeaf
                );

            }

        }

        else {

    selectedLeaf = null;

    pendingPosition = {
        x: point.x,
        y: point.y
    };

    gesture = null;

    /* เริ่มจับเวลา 3 วินาที */

   startHoldProgress();

   clearTimeout(holdTimer);

   holdTimer = setTimeout(() => {

        stopHoldProgress();

        modal.classList.add("show");

        nameInput.value = "";

        setTimeout(() => {

            nameInput.focus();

    }, 80);

}, 3000);

}

        draw();

    }
);


/* =========================================================
   POINTER MOVE
========================================================= */

canvas.addEventListener(
    "pointermove",
    event => {

        event.preventDefault();


        if (
            !pointers.has(
                event.pointerId
            )
        ) {

            return;

        }


        const point =
            getPointerPosition(event);


        pointers.set(
            event.pointerId,
            point
        );


        /* single finger drag */

        if (
            gesture &&
            gesture.type === "drag" &&
            pointers.size === 1
        ) {

            const leaf =
                gesture.leaf;


            leaf.x =
                point.x -
                gesture.offsetX;


            leaf.y =
                point.y -
                gesture.offsetY;


            draw();

        }


        /* two finger transform */

        if (
            selectedLeaf &&
            pointers.size === 2
        ) {

            const points =
                [...pointers.values()];


            const p1 =
                points[0];

            const p2 =
                points[1];


            const distance =
                Math.hypot(
                    p2.x - p1.x,
                    p2.y - p1.y
                );


            const angle =
                Math.atan2(
                    p2.y - p1.y,
                    p2.x - p1.x
                );


            if (
                !gesture ||
                gesture.type !==
                "transform"
            ) {

                gesture = {

                    type:
                        "transform",

                    leaf:
                        selectedLeaf,

                    initialDistance:
                        distance,

                    initialAngle:
                        angle,

                    initialScale:
                        selectedLeaf.scale,

                    initialRotation:
                        selectedLeaf.rotation

                };

            }


            selectedLeaf.scale =
                Math.max(
                    .45,
                    Math.min(
                        1.4,
                        gesture.initialScale *
                        distance /
                        gesture.initialDistance
                    )
                );


            selectedLeaf.rotation =
                gesture.initialRotation +
                (
                    angle -
                    gesture.initialAngle
                );


            selectedLeaf.x =
                (p1.x + p2.x) / 2;


            selectedLeaf.y =
                (p1.y + p2.y) / 2;


            draw();

        }

    }
);


/* =========================================================
   POINTER END
========================================================= */

function pointerEnd(
    event
) {

    pointers.delete(
        event.pointerId
    );

/* ถ้าปล่อยมือก่อนครบ 3 วินาที ให้ยกเลิก */

if (holdTimer) {

    clearTimeout(holdTimer);

    holdTimer = null;

    stopHoldProgress();

}

    if (
        pointers.size === 0
    ) {

        touchIndicator.style.display =
            "none";


        if (
            gesture &&
            (
                gesture.type ===
                "drag" ||
                gesture.type ===
                "transform"
            )
        ) {

            saveTree();

            draw();

        }

        pendingPosition =
            null;

        gesture =
            null;

    }

}


canvas.addEventListener(
    "pointerup",
    pointerEnd
);

canvas.addEventListener(
    "pointercancel",
    pointerEnd
);


/* =========================================================
   ADD NEW HAND
========================================================= */

nameForm.addEventListener(
    "submit",
    event => {

        event.preventDefault();


        const name =
            nameInput.value.trim();


        if (!name) {

            return;

        }


        const scale =
            Math.min(
                W,
                H
            ) / 720;


        const newLeaf = {

            id:
                Date.now() +
                Math.random(),

            name:

                name,

            color:

                COLORS[
                    Math.floor(
                        Math.random() *
                        COLORS.length
                    )
                ],

            x:

                pendingPosition?.x ??
                W / 2,

            y:

                pendingPosition?.y ??
                H / 2,

            scale:

                scale,

            rotation:

                (Math.random() - .5) *
                .35

        };


        leaves.push(
            newLeaf
        );


        selectedLeaf =
            newLeaf;


        saveTree();


        modal.classList.remove(
            "show"
        );


        pendingPosition =
            null;


        draw();


        showToast(
            "เพิ่มมือของ " +
            name +
            " แล้ว! 🌿"
        );

    }
);


/* =========================================================
   CANCEL MODAL
========================================================= */

document
    .getElementById(
        "cancelButton"
    )
    .addEventListener(
        "click",
        () => {

            modal.classList.remove(
                "show"
            );

            pendingPosition =
                null;

        }
    );


/* =========================================================
   CLOSE MODAL BY CLICKING OUTSIDE
========================================================= */

modal.addEventListener(
    "pointerdown",
    event => {

        if (
            event.target === modal
        ) {

            modal.classList.remove(
                "show"
            );

            pendingPosition =
                null;

        }

    }
);


/* =========================================================
   TEACHER PANEL
========================================================= */

teacherButton.addEventListener(
    "click",
    () => {

        teacherPanel.classList.toggle(
            "show"
        );

    }
);


document
    .getElementById(
        "closeTeacherButton"
    )
    .addEventListener(
        "click",
        () => {

            teacherPanel.classList.remove(
                "show"
            );

        }
    );


/* =========================================================
   CLEAR TREE
========================================================= */

document
    .getElementById(
        "clearButton"
    )
    .addEventListener(
        "click",
        () => {

            const confirmation =
                prompt(
                    "พิมพ์ CLEAR เพื่อยืนยันการล้างต้นไม้"
                );


            if (
                confirmation ===
                "CLEAR"
            ) {

                leaves = [];

                selectedLeaf =
                    null;

                saveTree();

                draw();

                teacherPanel.classList.remove(
                    "show"
                );

                showToast(
                    "ล้างต้นไม้แล้ว 🌱"
                );

            }

        }
    );


/* =========================================================
   EXPORT PNG
========================================================= */

document
    .getElementById(
        "exportButton"
    )
    .addEventListener(
        "click",
        () => {

            const previous =
                selectedLeaf;


            selectedLeaf =
                null;


            draw();


            const exportCanvas =
                document.createElement(
                    "canvas"
                );


            exportCanvas.width =
                W * DPR;


            exportCanvas.height =
                H * DPR;


            const exportContext =
                exportCanvas.getContext(
                    "2d"
                );


            exportContext.drawImage(
                canvas,
                0,
                0
            );


            selectedLeaf =
                previous;


            draw();


            const link =
                document.createElement(
                    "a"
                );


            link.download =
                "our-class-tree.png";


            link.href =
                exportCanvas.toDataURL(
                    "image/png"
                );


            link.click();


            showToast(
                "บันทึกภาพต้นไม้แล้ว 📸"
            );

        }
    );


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(
    message
) {

    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================================
   START
========================================================= */

updateCounter();

resizeCanvas();

createAnimatedLeaves();

animate();
      
</script>
